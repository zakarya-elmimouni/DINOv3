# -------------------
# Model Configuration
# -------------------
model:
  # Use smaller model since pretrained weights aren't loading correctly
  # Options: 'dinov3_vits16' (small, ~22M params), 'dinov3_vitb16' (base, ~86M params), 'dinov3_vitl16' (large, ~304M params)
  backbone: 'dinov3_vitl16'
  
  # Leave empty to train from scratch, or provide path to .pth file
  backbone_weights_path: 'dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth'
  
  freeze_backbone: True  # lrTrain the backbone from scratch
  adapter_dim: 256
  num_queries: 2
  img_size: 500 # Should match the img_size in the dataset section

# -------------------
# Dataset Paths
# -------------------
dataset:
  train_img_dir: 'dataset/train/images'
  train_label_dir: 'dataset/train/labels'
  val_img_dir: 'dataset/val/images'
  val_label_dir: 'dataset/val/labels'

# ----------------------
# Optimizer & Scheduler
# ----------------------
optimizer:
  epochs: 50
  batch_size: 16  # Increased since smaller model uses less memory
  learning_rate: 0.0001  # Lower LR for training the adapter on frozen backbone
  weight_decay: 0.001

# -------------------
# Loss Weights
# -------------------
loss_weights:
  class: 5.0   # Reduced to encourage more predictions
  bbox: 5.0    # Keep high - localization is important
  giou: 2.0    # Keep same - shape matters
  obj: 2.0     # INCREASED - penalize not predicting objects!

# -------------------
# General Settings
# -------------------
checkpoint_dir: 'checkpoints_Detr_decoder_100epochs'
num_workers: 0 # Number of CPU cores for data loading. Set to 0 if you have memory issues on Windows.
use_amp: True # Use Automatic Mixed Precision (recommended for modern GPUs)
patience: 15  # Early stopping patience (number of epochs without improvement)